<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Dancing Script" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>
    <nav class="navbar navbar-dark navbar-expand-lg bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{% url 'home' %}" style="color: yellow; font-family: 'Dancing Script'; font-size:2rem;">SpiceVillage</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{% url 'home' %}" style="color: white;">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" style="color: white;">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'products' %}" style="color: white;">Products</a>
        </li>
         <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}" style="color: white;">Contact</a>
        </li>
      </ul>
      {% if user.is_authenticated %}
        <p class="mt-2 px-2" style="color: white;">Welcome, {{ user.username }}!</p>
        <form method="post" action="{% url 'logoutuser' %}"  metho='get'>
          {% csrf_token %}
          <button class="btn btn-primary" type="submit">Logout</button>
        </form>
      {% else %}
      <form method="post" action="{% url 'loginuser' %}" metho='get'>
        {% csrf_token %}
        <button class="btn btn-primary" type="submit">Login</button>\
        </form>
        <form method="post" action="{% url 'signupuser' %}"  metho='get'>
        {% csrf_token %}
        <button class="btn btn-primary" type="submit">signup</button>\
        </form>
      {% endif %}
      <form class="d-flex px-2" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
